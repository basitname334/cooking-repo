services:
  - type: web
    name: food-management-system
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: food-management-db
          property: connectionString
      - key: DB_SSL_REQUIRED
        value: "true"
    healthCheckPath: /health.php

databases:
  - name: food-management-db
    plan: free
    databaseName: abdul_basit
    user: abdul_basit_user
