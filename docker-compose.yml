version: '3.8'

services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/food_management_system
      - DB_SSLMODE=disable
    depends_on:
      - db
    volumes:
      - ./uploads:/var/www/html/uploads

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=food_management_system
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/schema.pgsql.sql:/docker-entrypoint-initdb.d/01-schema.sql

volumes:
  db_data:
